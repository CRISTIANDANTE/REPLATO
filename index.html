<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPLATO - Restaurante Universitario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container" style="max-width: 1000px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        
        <!-- Sección de Bienvenida Principal -->
        <section class="welcome-section" style="width: 100%; margin: 0;">
            <div class="welcome-card" style="padding: 5rem 3rem; text-align: center;">
                
                <h2 style="font-size: 3.5rem; margin-bottom: 1.5rem; font-weight: 900; color: #ffffff;">
                    ¡Bienvenido a RPLATO! 🍽️
                </h2>
                
                <p style="font-size: 1.4rem; max-width: 750px; margin: 0 auto 3.5rem auto; line-height: 1.7; color: #cbd5e1;">
                    Tu solución inteligente para consultar el menú universitario en tiempo real, hacer tus pedidos al instante y evitar largas filas en el campus.
                </p>
                
                <div class="welcome-actions" style="display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;">
                    <a href="index3.html" class="btn-main" style="font-size: 1.3rem; padding: 1.3rem 3rem; border-radius: 14px; text-decoration: none;">
                        🍽️ Menú de Cafetería
                    </a>
                    
                    <a href="index2.html" class="btn-secondary" style="font-size: 1.3rem; padding: 1.3rem 3rem; border-radius: 14px; text-decoration: none;">
                        👨‍🍳 Administración de Cafetería
                    </a>
                </div>

            </div>
        </section>

    </main>

</html>
