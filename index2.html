<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPLATO - Acceso Cafetería</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">

        <section class="auth-section" style="width: 100%; max-width: 500px;">

            <div class="auth-card">

                <!-- IDENTIDAD -->
                <div class="auth-brand">
                    <div class="auth-logo">R</div>
                    <h2>RPLATO - Personal</h2>
                    <p>Módulo de gestión y edición del menú</p>
                </div>

                <!-- PESTAÑAS -->
                <div class="auth-tabs">
                    <button type="button" id="loginTab" class="auth-tab active" onclick="showLogin()">
                        Acceso Cafetería
                    </button>

                    <button type="button" id="registerTab" class="auth-tab" onclick="showRegister()">
                        Ayuda / Info
                    </button>
                </div>

                <!-- FORMULARIO SOLO CON CONTRASEÑA -->
                <form id="loginForm" class="auth-form" onsubmit="validarAcceso(event)">

                    <h3>Panel de Edición</h3>

                    <label for="loginPassword">
                        Ingrese la contraseña para edición de alimentos
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="••••••••••••"
                        autocomplete="current-password"
                        required>

                    <p id="errorMsg" style="color: #ff6b6b; font-size: 1.05rem; font-weight: bold; display: none; margin-bottom: 1rem;">
                        ❌ Contraseña incorrecta. Intenta nuevamente.
                    </p>

                    <button type="submit" class="btn-main">
                        Entrar al Panel de Edición
                    </button>

                </form>

                <!-- PESTAÑA INFORMACIÓN -->
                <div id="registerForm" class="auth-form" hidden style="text-align: center; padding: 1rem 0;">
                    <h3 style="font-size: 1.5rem;">¿Necesitas la clave de acceso?</h3>
                    <p style="margin-top: 1rem; line-height: 1.6; color: #cbd5e1; font-size: 1.15rem;">
                        La contraseña de edición se gestiona únicamente con la administración del restaurante universitario.
                    </p>
                </div>

                <!-- REGRESAR AL INICIO -->
                <div class="auth-back" style="margin-top: 1.5rem; text-align: center;">
                    <a href="index.html" class="nav-link" style="text-decoration: none; color: #00d2d3; font-weight: bold;">
                        ← Volver a la página principal
                    </a>
                </div>

            </div>

        </section>

    </main>

    <!-- FUNCIONES DE VALIDACIÓN -->
    <script>
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const errorMsg = document.getElementById("errorMsg");

        function showLogin() {
            loginForm.hidden = false;
            registerForm.hidden = true;
            loginTab.classList.add("active");
            registerTab.classList.remove("active");
        }

        function showRegister() {
            loginForm.hidden = true;
            registerForm.hidden = false;
            registerTab.classList.add("active");
            loginTab.classList.remove("active");
        }

        function validarAcceso(e) {
            e.preventDefault();
            const passwordIngresada = document.getElementById("loginPassword").value;
            const contrasenaCorrecta = "UTADEO.Cafeteria.feliz";

            if (passwordIngresada === contrasenaCorrecta) {
                errorMsg.style.display = "none";
                alert("¡Acceso concedido! Redirigiendo al panel de edición...");
                window.location.href = "admin.html";
            } else {
                errorMsg.style.display = "block";
            }
        }
    </script>

</body>
</html>
